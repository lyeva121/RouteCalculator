<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4CAF50">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Маршрут">
<title>Расчёт маршрута</title>
<style>
:root{--bg:#f0f0f0;--fg:#111;--cell:#fff;--head:#d9d9d9;--line:#777;--dis:#e4e4e4;--res:#f7f7f7;--sel:#b3d4ff;--ttl:#000;--bw:140px;--bh:40px}
@media (prefers-color-scheme:dark){:root{--bg:#222;--fg:#eee;--cell:#2e2e2e;--head:#444;--line:#999;--dis:#3a3a3a;--res:#2a2a2a;--sel:#2f5b8f;--ttl:#eee}}
*{box-sizing:border-box}
body{margin:0;padding:10px;background:var(--bg);color:var(--fg);font:15px Arial,sans-serif;text-align:center}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:10px;width:100%;max-width:1100px;margin:6px auto 10px}
.ttl{font-size:24px;font-weight:bold;line-height:1.1;color:var(--ttl);text-align:left}
.dev{font-size:12px;font-style:italic;color:gray;text-align:right}
.ctl{display:flex;justify-content:center;align-items:flex-end;gap:10px;flex-wrap:wrap}
#speed{height:var(--bh)}
.ctl label{display:block;margin-bottom:3px}
.hist small{display:block;font-style:italic;color:gray;font-size:12px;margin-bottom:3px}
.wrap{overflow-x:auto;width:100%;max-width:1100px;margin:0 auto}
table{border-collapse:collapse;table-layout:fixed;width:100%;min-width:980px}
th,td{border:1px solid var(--line);padding:0}
th{background:var(--head);font-weight:normal;padding:4px 6px;height:24px}
td.res{background:var(--res);padding:2px 3px;white-space:nowrap}
td.e{background:var(--cell)}td.dis{background:var(--dis)}td.sel{background:var(--sel)}
input,textarea{width:100%;border:0;padding:5px 6px;font:16px Arial,sans-serif;background:transparent;color:var(--fg);text-align:center;outline-offset:-2px}
textarea{display:block;resize:none;overflow:hidden;overflow-wrap:break-word;word-break:normal;line-height:1.25;min-height:32px}
input[data-k=point],textarea{text-align:left}
input:disabled{background:transparent;opacity:1}
body.drag input,body.drag textarea{user-select:none}
.on{background:#4CAF50!important;color:#fff!important}
#bar{display:none;position:fixed;left:8px;bottom:8px;gap:6px;background:var(--bg);border:1px solid #666;border-radius:6px;padding:6px;z-index:6;box-shadow:0 2px 8px rgba(0,0,0,.3)}
#bar{flex-wrap:wrap;max-width:calc(100vw - 16px)}
#bar button{flex:none}
button{font:14px Arial,sans-serif;width:var(--bw);height:var(--bh);padding:0;border:1px solid #888;border-radius:4px;background:#e1e1e1;color:#111;cursor:pointer}
button:active{background:#cfcfcf}
.hist button{font-weight:bold;font-size:18px}
.hist{display:flex;flex-direction:column}
.hist div{display:flex;gap:10px}
.btns{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:10px 0}
#calc{background:#4CAF50;color:#fff;font:bold 18px Arial,sans-serif;width:auto;height:auto;padding:14px 40px;border-color:#3d8b40;margin:10px 0}
#total{white-space:pre-line;font-weight:bold;font-size:16px;min-height:44px;text-align:left;display:inline-block}
#warn{display:none;position:fixed;right:8px;top:120px;width:110px;background:#FFEB3B;color:#B71C1C;border:1px solid #333;padding:6px;font:bold 12px Arial;z-index:5}
#warn button{background:#4CAF50;color:#fff;width:auto;height:auto;padding:3px 14px;margin-top:4px;font-weight:bold}
dialog{max-width:720px;width:92vw;max-height:88vh;text-align:left;background:var(--cell);color:var(--fg);border:1px solid #666;border-radius:6px}
dialog p{margin:0 0 10px;line-height:1.35}
@media (max-width:900px){.top{grid-template-columns:1fr 1fr}.ctl{grid-column:1/-1;order:3}}
@media (max-width:640px){:root{--bw:42vw}#warn{top:auto;bottom:64px;width:150px}}
</style>
</head>
<body>
<div class="top">
  <div class="ttl">Расчет маршрута</div>
  <div class="ctl">
    <div><label for="speed">Скорость (км/ч)</label><input id="speed" style="width:120px;border:1px solid var(--line)" inputmode="decimal"></div>
    <div><button id="selmode" aria-pressed="false" title="Выделение диапазона ячеек касанием первой и последней">Выделение ячеек</button></div>
    <div class="hist"><small>История</small><div><button id="undo" title="Назад">←</button><button id="redo" title="Вперёд">→</button></div></div>
  </div>
  <div class="dev">Разработчик Лёвочкин Виктор</div>
</div>
<div class="wrap"><table>
<colgroup><col style="width:20%"><col span="6" style="width:9.66%"><col style="width:22%"></colgroup>
<thead>
<tr><th rowspan="2" style="width:22%">ППМ</th><th rowspan="2">ЗМПУ</th><th rowspan="2">Расстояние</th><th colspan="2">Ветер метео</th><th rowspan="2">МК</th><th rowspan="2">Время</th><th rowspan="2" style="width:22%">Примечание</th></tr>
<tr><th>Напр. (°)</th><th>Скор. (км/ч)</th></tr>
</thead>
<tbody id="tb"></tbody>
</table></div>
<div id="bar"><button id="bCopy">Копировать</button><button id="bCut">Вырезать</button><button id="bPaste">Вставить</button><button id="bOff" title="Снять выделение">✕</button></div>
<div id="warn"><div style="font-size:16px">⚠</div>Проверь<br>соответствие<br>данных<br>в примечании<br><button id="warnOk">ОК</button></div>
<div class="btns">
  <button id="add">Добавить ППМ</button><button id="rev">Реверс</button><button id="nowind">Убрать ветер</button><button id="new">Новый маршрут</button>
</div>
<div class="btns">
  <button id="save">Сохранить</button><button id="open">Открыть</button><button id="pdf">PDF</button><button id="help">Помощь</button>
</div>
<input type="file" id="file" accept=".json,application/json" hidden>
<div><button id="calc">РАСЧЁТ</button></div>
<div id="total"></div>
<dialog id="dlg"><div id="helpText"></div><div style="text-align:center"><button id="dlgClose">Закрыть</button></div></dialog>

<script src="pdf.js"></script>
<script>
"use strict";
const $ = s => document.querySelector(s);
const KEYS = ["point","zmpu","distance","wd","ws","mk","time","note"];
const blank = () => ({point:"",zmpu:"",distance:"",wd:"",ws:"",note:"",mk:"",time:"",aw:null});
const newState = (n = 10) => ({speed:"", rows:Array.from({length:n}, blank), total:"", tv:[0,"0:00"]});
let S = newState(), H = [], hp = -1, focusRow = -1;
const tr = v => String(v).trim();
const toNum = v => parseFloat(tr(v).replace(",", "."));
const pyRound = x => { const r = Math.round(x); return Math.abs(x % 1) === 0.5 && r % 2 ? r - 1 : r; };
const fmt = m => Math.floor(m / 60) + ":" + String(m % 60).padStart(2, "0");
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

/* ---------- история (20 изменений) ---------- */
function push() {
  const snap = JSON.stringify(S);
  if (H[hp] === snap) return;
  H.length = hp + 1; H.push(snap);
  if (H.length > 21) H.shift();
  hp = H.length - 1;
}
function undo() { push(); if (hp > 0) { S = JSON.parse(H[--hp]); render(); } }
function redo() { push(); if (hp < H.length - 1) { S = JSON.parse(H[++hp]); render(); } }

/* ---------- таблица ---------- */
const CK = ["point", "zmpu", "distance", "note"];   // столбцы, доступные для выделения
let sel = null, anchor = null, selMode = false, drag = null, clip = "";
const tb = $("#tb");

function fit(el) { el.style.height = "auto"; el.style.height = el.scrollHeight + "px"; }
function fitAll() { document.querySelectorAll("#tb textarea").forEach(fit); }

function render(keepSel) {
  if (!keepSel) { sel = null; anchor = null; }
  $("#speed").value = S.speed;
  tb.innerHTML = "";
  S.rows.forEach((r, i) => {
    const row = document.createElement("tr");
    for (const k of KEYS) {
      const td = document.createElement("td");
      if (k === "mk" || k === "time") { td.className = "res"; td.textContent = i === 0 ? "—" : r[k]; }
      else {
        const dis = i === 0 && (k === "zmpu" || k === "distance");
        const inp = document.createElement(k === "note" ? "textarea" : "input");
        if (k === "note") inp.rows = 1;
        inp.value = r[k]; inp.dataset.i = i; inp.dataset.k = k;
        if (k === "zmpu") inp.inputMode = "numeric";
        if (k === "distance" || k === "wd" || k === "ws") inp.inputMode = "decimal";
        inp.disabled = dis; inp.readOnly = selMode;
        td.className = dis ? "dis" : "e"; td.append(inp);
      }
      row.append(td);
    }
    tb.append(row);
  });
  $("#total").textContent = S.total;
  fitAll(); paintSel();
}

/* ---------- выделение ячеек ---------- */
const inSel = (i, c) => !!sel && i >= sel.r1 && i <= sel.r2 && c >= sel.c1 && c <= sel.c2;
function paintSel() {
  document.querySelectorAll("#tb input,#tb textarea").forEach(el =>
    el.parentElement.classList.toggle("sel", inSel(+el.dataset.i, CK.indexOf(el.dataset.k))));
  $("#bar").style.display = sel ? "flex" : "none";
}
function setSel(a, c) { sel = { r1: Math.min(a.r, c.r), r2: Math.max(a.r, c.r), c1: Math.min(a.c, c.c), c2: Math.max(a.c, c.c) }; paintSel(); }
function clearSel() { sel = null; anchor = null; paintSel(); }
function cellOf(el) {
  const td = el && el.closest ? el.closest("td") : null, x = td && td.querySelector("input,textarea");
  if (!x || x.dataset.i === undefined) return null;
  const c = CK.indexOf(x.dataset.k); return c < 0 ? null : { r: +x.dataset.i, c };
}
const isDis = (i, c) => i === 0 && (c === 1 || c === 2);

const toTSV = g => g.map(r => r.map(v => /[\t\n"]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v).join("\t")).join("\n");
function parseTSV(t) {
  t = t.replace(/\r\n?/g, "\n").replace(/\n$/, ""); const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i <= t.length; i++) {
    const ch = t[i];
    if (q) { if (ch === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else if (ch === undefined) { row.push(f); rows.push(row); } else f += ch; continue; }
    if (ch === '"' && f === "") q = true;
    else if (ch === "\t") { row.push(f); f = ""; }
    else if (ch === "\n" || ch === undefined) { row.push(f); rows.push(row); row = []; f = ""; }
    else f += ch;
  }
  return rows;
}
function copySel() {
  const g = [];
  for (let i = sel.r1; i <= sel.r2; i++) { const row = []; for (let c = sel.c1; c <= sel.c2; c++) row.push(isDis(i, c) || !S.rows[i] ? "" : S.rows[i][CK[c]]); g.push(row); }
  clip = toTSV(g);
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(clip).catch(() => {});
}
function clearCells() {
  push();
  for (let i = sel.r1; i <= sel.r2; i++) for (let c = sel.c1; c <= sel.c2; c++) if (!isDis(i, c)) S.rows[i][CK[c]] = "";
  push(); render(true);
}
function cutSel() { copySel(); clearCells(); }
function pasteText(t, at) {
  const g = parseTSV(t); if (!g.length) return;
  const r0 = sel ? sel.r1 : at.r, c0 = sel ? sel.c1 : at.c, one = g.length === 1 && g[0].length === 1;
  const rr = one && sel ? sel.r2 : r0 + g.length - 1;
  const cc = one && sel ? sel.c2 : Math.min(CK.length - 1, c0 + Math.max(...g.map(x => x.length)) - 1);
  push();
  while (S.rows.length <= rr) S.rows.push(blank());
  for (let i = r0; i <= rr; i++) for (let c = c0; c <= cc; c++) {
    if (isDis(i, c)) continue;
    const v = one ? g[0][0] : (g[i - r0] || [])[c - c0];
    if (v !== undefined) S.rows[i][CK[c]] = v;
  }
  push(); render(true); setSel({ r: r0, c: c0 }, { r: rr, c: cc });
}
async function pasteBtn() {
  if (!sel) return; let t = clip;
  try { if (navigator.clipboard && navigator.clipboard.readText) t = await navigator.clipboard.readText(); } catch (_) {}
  if (t) pasteText(t, null);
}

tb.addEventListener("input", e => {
  const { i, k } = e.target.dataset; if (i === undefined) return;
  S.rows[i][k] = e.target.value;
  if (k === "wd" || k === "ws") S.rows[i].aw = null;
  if (e.target.tagName === "TEXTAREA") fit(e.target);
});
tb.addEventListener("change", push);
tb.addEventListener("focusin", e => { if (e.target.dataset.i !== undefined) focusRow = +e.target.dataset.i; });
tb.addEventListener("keydown", e => {
  const el = e.target, k = el.dataset.k; if (!k) return;
  const ta = el.tagName === "TEXTAREA", n = el.value.length, a = el.selectionStart, z = el.selectionEnd;
  const all = a === 0 && z === n, atStart = a === 0 && z === 0, atEnd = a === n && z === n;
  const plain = !(e.shiftKey || e.ctrlKey || e.altKey || e.metaKey);
  let dr = 0, dc = 0;
  if (e.key === "Enter" && !(ta && e.shiftKey)) dr = 1;
  else if (plain && e.key === "ArrowDown" && (!ta || all || atEnd)) dr = 1;
  else if (plain && e.key === "ArrowUp" && (!ta || all || atStart)) dr = -1;
  else if (plain && e.key === "ArrowLeft" && (all || atStart)) dc = -1;
  else if (plain && e.key === "ArrowRight" && (all || atEnd)) dc = 1;
  if (!dr && !dc) return;
  // влево/вправо — по ячейкам строки, вверх/вниз — по ячейкам столбца
  const list = dc
    ? [...tb.rows[+el.dataset.i].querySelectorAll("input,textarea")]
    : [...tb.querySelectorAll(`[data-k="${k}"]`)];
  const cells = list.filter(x => !x.disabled), nx = cells[cells.indexOf(el) + dr + dc];
  if (nx) { e.preventDefault(); nx.focus(); nx.select(); }
});
// выделение мышью: нажать в ячейке и протянуть на другие ячейки
tb.addEventListener("mousedown", e => {
  if (selMode || e.button !== 0) return;
  if (sel) clearSel();
  const c = cellOf(e.target); drag = c ? { c } : null;
});
tb.addEventListener("mousemove", e => {
  if (!drag || e.buttons !== 1) return;
  const c = cellOf(document.elementFromPoint(e.clientX, e.clientY));
  if (!c || (!sel && c.r === drag.c.r && c.c === drag.c.c)) return;
  document.body.classList.add("drag");
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  getSelection().removeAllRanges(); setSel(drag.c, c);
});
addEventListener("mouseup", () => { drag = null; document.body.classList.remove("drag"); });
// режим «Выделение ячеек» (планшет): касание первой и последней ячейки диапазона
tb.addEventListener("click", e => {
  if (!selMode) return; const c = cellOf(e.target); if (!c) return;
  e.preventDefault();
  if (!anchor) { anchor = c; setSel(c, c); } else { setSel(anchor, c); anchor = null; }
});
$("#selmode").onclick = () => {
  selMode = !selMode;
  $("#selmode").classList.toggle("on", selMode); $("#selmode").setAttribute("aria-pressed", String(selMode));
  document.querySelectorAll("#tb input,#tb textarea").forEach(el => { el.readOnly = selMode; });
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  clearSel();
};
document.addEventListener("keydown", e => {
  if (!sel) return;
  const a = document.activeElement;
  if (a && a.matches && a.matches("input,textarea") && !a.readOnly) return;
  const k = e.key.toLowerCase();
  if (e.key === "Escape") clearSel();
  else if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); clearCells(); }
  else if ((e.ctrlKey || e.metaKey) && k === "c") { e.preventDefault(); copySel(); }
  else if ((e.ctrlKey || e.metaKey) && k === "x") { e.preventDefault(); cutSel(); }
  else if ((e.ctrlKey || e.metaKey) && k === "v") { e.preventDefault(); pasteBtn(); }
});
document.addEventListener("copy", e => { if (!sel) return; e.preventDefault(); copySel(); e.clipboardData.setData("text/plain", clip); });
document.addEventListener("cut", e => { if (!sel) return; e.preventDefault(); copySel(); e.clipboardData.setData("text/plain", clip); clearCells(); });
document.addEventListener("paste", e => {
  const t = e.clipboardData.getData("text/plain"), a = document.activeElement, c = cellOf(a);
  if (sel) { e.preventDefault(); pasteText(t, null); }
  else if (c && (t.includes("\t") || (t.includes("\n") && a.tagName !== "TEXTAREA"))) { e.preventDefault(); pasteText(t, c); }
});
$("#bCopy").onclick = copySel; $("#bCut").onclick = cutSel; $("#bPaste").onclick = pasteBtn; $("#bOff").onclick = clearSel;
addEventListener("resize", fitAll);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);
$("#speed").addEventListener("input", e => { S.speed = e.target.value; });
$("#speed").addEventListener("change", push);

/* ---------- проверка данных и расчёт ---------- */
function check() {
  const e = [], R = S.rows;
  const used = (r, i) => tr(r.point) || (i && (tr(r.zmpu) || tr(r.distance)));
  const any = R.some((r, i) => used(r, i));
  const NUM = /^\d+([.,]\d+)?$/, INT = /^\d+$/;
  R.forEach((r, i) => {
    const p = tr(r.point), lab = "строка " + (i + 1) + (p ? ` (ППМ '${p}')` : "");
    if (i === 0) { if (any && !p) e.push("строка 1: не заполнена ячейка «ППМ»"); }
    else if (used(r, i)) {
      const z = tr(r.zmpu), d = tr(r.distance);
      if (!p) e.push(lab + ": не заполнена ячейка «ППМ»");
      if (!z) e.push(lab + ": не заполнена ячейка «ЗМПУ»");
      else if (!INT.test(z)) e.push(lab + ": в ячейке «ЗМПУ» должно быть целое число (только цифры)");
      else if (+z > 359) e.push(lab + ": ЗМПУ должен быть в диапазоне 0–359");
      if (!d) e.push(lab + ": не заполнена ячейка «Расстояние»");
      else if (!NUM.test(d)) e.push(lab + ": в ячейке «Расстояние» должно быть число (только цифры, десятичная дробь)");
    }
    if (p || i === 0) {
      const wd = tr(r.wd), ws = tr(r.ws);
      if (wd && !NUM.test(wd)) e.push(lab + ": направление ветра должно быть числом (только цифры)");
      else if (wd && toNum(wd) > 359) e.push(lab + ": направление ветра должно быть в диапазоне 0–359");
      if (ws && !NUM.test(ws)) e.push(lab + ": скорость ветра должна быть числом (только цифры)");
    }
  });
  return e;
}
const preview = a => a.slice(0, 12).join("\n") + (a.length > 12 ? `\n… и ещё ${a.length - 12}` : "");

function calc() {
  push();
  try { calc2(); } finally { push(); render(); }
}
function calc2() {
  S.rows.forEach((r, i) => { if (i) r.mk = r.time = ""; });
  S.total = ""; S.tv = [0, "0:00"];
  const v = toNum(S.speed);
  if (!(v > 0)) { alert("Не задана или некорректна скорость. Проверьте данные перед расчётом."); return; }
  const errs = check();
  if (errs.length) { alert("Расчёт не выполнен. Проверьте данные:\n\n" + preview(errs)); return; }
  const miss = [];
  S.rows.forEach((r, i) => {
    const p = tr(r.point);
    if (!p) { if (["zmpu","distance","wd","ws","note"].some(k => tr(r[k]))) miss.push(`строка ${i + 1}: ППМ`); }
    else if (!!tr(r.wd) !== !!tr(r.ws)) miss.push(`ППМ '${p}': направление/скорость ветра`);
  });
  if (miss.length && !confirm("Обнаружены пропущенные или неполные данные:\n\n" + preview(miss) + "\n\nПродолжить расчёт?")) return;

  // ветер, проставленный автоматически ранее и не изменённый, обновляется
  S.rows.forEach(r => {
    if (r.aw && tr(r.wd) === r.aw[0] && tr(r.ws) === r.aw[1]) r.wd = r.ws = "";
    r.aw = null;
  });
  let cd = "", cs = "";
  S.rows.forEach(r => {
    if (!tr(r.point)) return;
    const d = tr(r.wd), s = tr(r.ws);
    if (d || s) { cd = d; cs = s; }
    else if (cd || cs) { r.wd = cd; r.ws = cs; r.aw = [cd, cs]; }
  });

  let tm = 0, td = 0, wd = null, ws = null; const res = [];
  for (let i = 0; i < S.rows.length; i++) {
    const r = S.rows[i], p = tr(r.point);
    if (i > 0 && !p) continue;
    if (i > 0) {
      const z = +r.zmpu, dist = toNum(r.distance);
      if (wd === null || ws === null) { alert(`Не заданы параметры ветра для участка до ППМ '${p}'`); return; }
      const a = (wd + 180 - z) * Math.PI / 180;
      const mk = (((pyRound(z - (ws / v) * Math.sin(a) * 57.3)) % 360) + 360) % 360;
      const gs = v + ws * Math.cos(a);
      if (!(gs > 0)) { alert(`На участке до ППМ '${p}' встречная составляющая ветра не меньше скорости полёта: расчёт времени невозможен`); return; }
      const m = pyRound(dist / gs * 60); tm += m; td += dist;
      res.push([r, String(mk), fmt(m) + " / " + fmt(tm)]);
    }
    if (tr(r.wd)) wd = toNum(r.wd);
    if (tr(r.ws)) ws = toNum(r.ws);
  }
  res.forEach(([r, a, b]) => { r.mk = a; r.time = b; });
  S.tv = [pyRound(td), fmt(tm)];
  S.total = `Общее расстояние: ${S.tv[0]} км\nОбщее время: ${S.tv[1]}`;
}

/* ---------- действия ---------- */
function addRow() {
  push();
  const at = focusRow >= 0 && focusRow < S.rows.length ? focusRow + 1 : S.rows.length;
  S.rows.splice(at, 0, blank());
  S.rows.forEach((r, i) => { if (i) r.mk = r.time = ""; });
  push(); render();
  const inp = document.querySelector(`input[data-i="${at}"][data-k="point"]`); if (inp) inp.focus();
}
function removeWind() {
  push();
  S.rows.forEach((r, i) => { r.wd = r.ws = ""; r.aw = null; if (i) r.mk = r.time = ""; });
  S.total = ""; S.tv = [0, "0:00"];
  push(); render();
}
function newRoute() { push(); S = newState(); $("#warn").style.display = "none"; push(); render(); }

function reverse() {
  const rd = S.rows.filter(r => tr(r.point)).map(r => ({
    point: tr(r.point), zmpu: tr(r.zmpu), distance: tr(r.distance), wd: tr(r.wd), ws: tr(r.ws), note: r.note }));
  const n = rd.length;
  if (n < 2) { alert("Недостаточно ППМ"); return; }
  push();
  const ed = Array(n).fill(""), es = Array(n).fill(""); let cd = "", cs = "";
  for (let i = 1; i < n; i++) {
    if (rd[i - 1].wd) cd = rd[i - 1].wd;
    if (rd[i - 1].ws) cs = rd[i - 1].ws;
    ed[i] = cd; es[i] = cs;
  }
  const legs = [];
  for (let j = 1; j < n; j++) {
    const s = n - j, it = rd[s], z = parseFloat(it.zmpu);
    legs.push({ zmpu: isNaN(z) ? "" : String(pyRound((z + 180) % 360)), distance: it.distance, wd: ed[s], ws: es[s] });
  }
  const sp = S.speed; S = newState(Math.max(10, n)); S.speed = sp;
  [...rd].reverse().forEach((it, i) => {
    const r = S.rows[i]; r.point = it.point;
    r.note = i < n - 1 ? rd[n - 2 - i].note : "";
    if (i < n - 1) {
      const nl = legs[i], pd = i ? legs[i - 1].wd : "", ps = i ? legs[i - 1].ws : "";
      if (nl.wd && (i === 0 || nl.wd !== pd)) r.wd = nl.wd;
      if (nl.ws && (i === 0 || nl.ws !== ps)) r.ws = nl.ws;
    }
    if (i) { r.zmpu = legs[i - 1].zmpu; r.distance = legs[i - 1].distance; }
  });
  push(); render(); $("#warn").style.display = "block";
}

function save() {
  const data = { speed: S.speed, rows: S.rows.map(r => ({ point: r.point, zmpu: r.zmpu, distance: r.distance, note: r.note })) };
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 4)], { type: "application/json" }));
  a.download = "route.json"; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$("#file").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const d = JSON.parse(await f.text()), rows = d.rows === undefined ? [] : d.rows;
    if (!Array.isArray(rows) || !rows.every(r => r && typeof r === "object" && !Array.isArray(r))) throw 0;
    const t = v => v == null ? "" : String(v);
    push(); S = newState(Math.max(10, rows.length)); S.speed = t(d.speed);
    rows.forEach((x, i) => {
      const r = S.rows[i]; r.point = t(x.point); r.note = t(x.note);
      if (i) { r.zmpu = t(x.zmpu); r.distance = t(x.distance); }
    });
    push(); render();
  } catch (_) { alert("Не удалось открыть файл: это не сохранённый маршрут или файл повреждён."); }
});

async function pdf() {
  const win = window.open("", "_blank");            // открываем сразу, пока действует нажатие
  try {
    const R = S.rows, t = v => tr(v), pts = R.filter(r => t(r.point)).map(r => t(r.point));
    const title = pts.length >= 2 ? `Маршрут: ${pts[0]} — ${pts[pts.length - 1]}` : pts.length ? `Маршрут: ${pts[0]}` : "Маршрут: —";
    const winds = [];
    const rows = R.map((r, i) => ({ r, i })).filter(x => t(x.r.point)).map(({ r, i }) => {
      if (t(r.wd) || t(r.ws)) winds.push({ ppm: t(r.point), w: `${t(r.wd)}° / ${t(r.ws)} км/ч` });
      return i ? [t(r.point), r.distance, r.mk, r.time, r.note] : [t(r.point), "—", "—", "—", r.note];
    });
    let wt = "Ветер по маршруту: —";
    if (winds.length) {
      if (winds.every(x => x.w === winds[0].w)) wt = "Ветер по маршруту: " + winds[0].w;
      else {
        const parts = [winds[0].w]; let last = winds[0].w;
        winds.slice(1).forEach(x => { if (x.w !== last) { parts.push(`после ППМ ${x.ppm} ${x.w}`); last = x.w; } });
        wt = `Ветер по маршруту: (${parts.join("; ")})`;
      }
    }
    const bytes = await window.buildPdf({
      title, header: ["ППМ", "S", "МК", "Время", "Примечание"], rows,
      info: [`Общее расстояние: ${S.tv[0]} км`, `Общее время: ${S.tv[1]}`, wt] });
    const url = URL.createObjectURL(new Blob([bytes], { type: "application/pdf" }));
    if (win) win.location.href = url;
    else { const a = document.createElement("a"); a.href = url; a.download = "route.pdf"; document.body.append(a); a.click(); a.remove(); }
    setTimeout(() => URL.revokeObjectURL(url), 120000);
  } catch (e) { if (win) win.close(); alert("Ошибка создания PDF: " + e.message); }
}

const HELP = [
`Данное приложение предназначено для подготовки к полету по заранее известному маршруту с учетом ветра.`,
`Пользователь вносит необходимые для приложения данные: ППМ, ЗМПУ и расстояние. Указывает метеорологический ветер, а именно направление (откуда дует) и скорость в км/ч. Если ветер меняется по маршруту, то пользователю достаточно указать данные ветра в ячейках напротив того ППМ, где он изменяется (при расчете маршрута предыдущие ячейки данных ветра заполнятся предыдущими значениями), а последующие ячейки последующими данными ветра. Таким образом, если ветер часто меняется по маршруту, то необходимо указывать его только напротив того ППМ, где он изменился, пустые ячейки заполняться автоматически.`,
`В столбце «Примечание» можно писать любую необходимую пользователю информацию.`,
`Также необходимо заполнить ячейку «Скорость», указав значение в км/ч.`,
`При нажатии кнопки «Расчет» будет выполнен расчет элементов полета по указанным пользователем параметрам ветра, а именно МК и время (время до следующего ППМ и время, накопленное с начала полета).`,
`При нажатии кнопки «PDF» откроется отдельная вкладка с необходимыми для выполнения полета данными. Этот вкладку можно распечатать или сохранить.`,
`Кнопка «Сохранить» дает возможность сохранить файл в формате .json для последующего использования этого маршрута в другом полете. Сохраняются все данные, кроме ветра.`,
`Кнопка «Открыть» соответственно дает возможность открыть сохраненные маршруты.`,
`Кнопка «Добавить ППМ» вставляет строку после строки с которой в данный момент работает пользователь. Если пользователь в данный момент не работает с какой-либо строкой — строка добавляется в конец.`,
`Кнопка «Реверс» разворачивает маршрут. ВНИМАНИЕ: при нажатии этой кнопки появляется предупреждение о необходимости проверить соответствие данных в ячейках «Примечание», возможно несовпадение данных с соответствующими ППМ.`,
`Кнопка «Убрать ветер» удаляет данные ветра в текущем маршруте.`,
`Кнопка «Новый маршрут» очищает все ячейки.`,
`Кнопки со стрелками «вперед – назад» позволяют отменить последние 20 изменений.`,
`При внесении данных маршрута на ПК в браузере перемещать курсор по ячейкам можно с помощью мыши или стрелок на клавиатуре. Также есть возможность с помощью мыши копировать, вставлять или вырезать отдельные символы, ячейки или целые строки.`,
`На планшете для действий с ячейками включите «Выделение ячеек»: коснитесь первой и затем последней ячейки диапазона. Копирование и вставка текста доступны через системное меню.`];
$("#helpText").innerHTML = HELP.map(t => `<p>${esc(t)}</p>`).join("");

$("#undo").onclick = undo; $("#redo").onclick = redo;
$("#add").onclick = addRow; $("#rev").onclick = reverse; $("#nowind").onclick = removeWind; $("#new").onclick = newRoute;
$("#save").onclick = save; $("#open").onclick = () => $("#file").click(); $("#pdf").onclick = pdf;
$("#help").onclick = () => $("#dlg").showModal(); $("#dlgClose").onclick = () => $("#dlg").close();
$("#calc").onclick = calc; $("#warnOk").onclick = () => { $("#warn").style.display = "none"; };
render(); push();
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
